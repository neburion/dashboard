<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0b0c">
<title>Dashboard</title>
<style>
/* Instrument, in Ink. Square hairline frames on a grid; the figure is large
   and the label beside it is small, letterspaced and quiet.

   Dark only, on purpose — the two trackers this sits beside are dark and the
   page is read on a phone at night as often as at a desk.

   ── the whole palette ─────────────────────────────────────────────────────
   Change a colour here and the page follows; nothing below names a colour
   directly. --accent is the identity, and it is red, which is why it is kept
   off anything that carries a reading: a red bar on this page always means
   something is wrong, never that something is normal. Healthy meters use
   --meter, which is deliberately not a signal colour at all. */
:root{
  color-scheme: dark;
  --bg:#0b0b0c;
  --panel:#141416;
  --rule:#272729;
  --ink:#eeeeef;
  --dim:#82828a;
  --accent:#d4483c;

  --ok:#4a9d6e;
  --warn:#cf9a2e;
  --bad:#d4483c;
  --meter:#5d6b7a;

  --sans:Geist,ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{
  background:var(--bg);color:var(--ink);
  font:400 15px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
  padding:0 0 60px;
}
.wrap{width:min(1320px,calc(100vw - 28px));margin:0 auto}

/* ── header ─────────────────────────────────────────────────────────── */
header{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--rule);
}
.bar{display:flex;align-items:center;gap:12px;padding:13px 0}
.mark{font:500 12px/1 var(--mono);letter-spacing:.26em;text-transform:uppercase;
  color:var(--accent)}
.spacer{flex:1}
.stamp{color:var(--dim);font:11.5px/1 var(--mono)}
.pulse{width:6px;height:6px;background:var(--ok)}
.pulse.off{background:var(--bad)}
button{
  padding:6px 13px;background:transparent;border:1px solid var(--rule);
  color:var(--ink);font:500 11px/1 var(--mono);letter-spacing:.14em;
  text-transform:uppercase;cursor:pointer;
}
button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}

/* ── banner ─────────────────────────────────────────────────────────── */
.banner{
  border:1px solid var(--rule);border-left:3px solid var(--accent);
  padding:17px 20px;display:flex;align-items:center;gap:22px;
  flex-wrap:wrap;margin-top:22px;
}
.banner.clear{border-left-color:var(--ok)}
.banner .big{font:500 22px/1.15 var(--sans);letter-spacing:-.02em}
.set{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap}
.set div{text-align:right}
.set b{display:block;font:500 17px/1.2 var(--mono)}
.set span{font:9.5px/1 var(--mono);letter-spacing:.15em;text-transform:uppercase;
  color:var(--dim)}

/* ── alerts ─────────────────────────────────────────────────────────── */
.alerts{display:flex;flex-direction:column;gap:1px;margin-top:11px;
  background:var(--rule);border:1px solid var(--rule)}
.alert{display:flex;align-items:baseline;gap:13px;padding:10px 15px;
  background:var(--panel);font-size:13.5px;flex-wrap:wrap}
.alert .who{color:var(--dim);font:11.5px/1.5 var(--mono);min-width:112px}
.alert .detail{color:var(--dim);font-size:12.5px}

/* ── sections and panels ────────────────────────────────────────────── */
h2{margin:30px 0 11px;font:500 10px/1 var(--mono);letter-spacing:.24em;
  text-transform:uppercase;color:var(--accent)}
.g{display:grid;gap:11px}
.g3{grid-template-columns:repeat(auto-fit,minmax(285px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.p{border:1px solid var(--rule);background:var(--panel);padding:14px 16px;
  display:flex;flex-direction:column}
.p.down{border-color:color-mix(in srgb,var(--bad) 50%,var(--rule))}
.cap{font:500 9.5px/1.3 var(--mono);letter-spacing:.2em;text-transform:uppercase;
  color:var(--dim);margin-bottom:11px;display:flex;justify-content:space-between;
  align-items:center;gap:10px}
.n{font:400 27px/1 var(--mono);letter-spacing:-.03em}
.n small{font-size:12px;color:var(--dim);letter-spacing:0;vertical-align:.72em;
  margin-left:3px}
.sub{font:10.5px/1.5 var(--mono);color:var(--dim);margin-top:7px}

/* State is a filled square plus a word — never colour alone, because the
   good/bad pair is indistinguishable to a red-green viewer. */
.st{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--mono);
  letter-spacing:.06em;white-space:nowrap}
.st i{width:6px;height:6px;flex:none}
.st.ok{color:var(--ok)}   .st.ok i{background:var(--ok)}
.st.warn{color:var(--warn)} .st.warn i{background:var(--warn)}
.st.bad{color:var(--bad)} .st.bad i{background:var(--bad)}
.st.idle{color:var(--dim)} .st.idle i{background:var(--dim)}

/* ── meters ─────────────────────────────────────────────────────────── */
.tr{height:2px;background:var(--rule);margin-top:9px}
.tr i{display:block;height:100%;background:var(--meter);
  transition:width .45s cubic-bezier(.4,0,.2,1)}
.tr.warn i{background:var(--warn)}
.tr.bad i{background:var(--bad)}
.m{margin-top:10px}
.m .lab{display:flex;justify-content:space-between;gap:10px;
  font:10.5px/1.4 var(--mono);color:var(--dim)}
.m .lab b{font-weight:400;color:var(--ink)}
.m .tr{margin-top:4px}

/* ── key/value blocks ───────────────────────────────────────────────── */
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin-top:11px;
  font:10.5px/1.45 var(--mono)}
.kv dt{color:var(--dim)}
.kv dd{text-align:right;overflow-wrap:anywhere}
.kv dd.ok{color:var(--ok)} .kv dd.warn{color:var(--warn)} .kv dd.bad{color:var(--bad)}
.kv dd.dim{color:var(--dim)}

/* ── tables ─────────────────────────────────────────────────────────── */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font:11.5px/1 var(--mono)}
th{text-align:left;font:500 9px/1 var(--mono);letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim);padding:0 14px 10px 0;white-space:nowrap}
td{padding:8px 14px 8px 0;border-top:1px solid var(--rule);white-space:nowrap}
tr:first-child td{border-top:0}
td.d{color:var(--dim)}
td.r,th.r{text-align:right;padding-right:0}
td.w{white-space:normal}

/* ── sparkline ──────────────────────────────────────────────────────── */
.sp{display:flex;align-items:flex-end;gap:2px;height:34px;margin-top:11px}
.sp i{flex:1;background:var(--meter);opacity:.5;min-height:2px}
.sp i:nth-child(5n){opacity:.85}
.sp i.none{background:var(--rule);opacity:1}
.ends{display:flex;justify-content:space-between;color:var(--dim);
  font:9.5px/1.6 var(--mono)}

/* ── peers ──────────────────────────────────────────────────────────── */
.peer{display:flex;align-items:center;gap:10px;margin-top:8px;
  font:10.5px/1 var(--mono)}
.peer .pn{min-width:76px;color:var(--dim)}
.peer .tr{flex:1;margin:0}
.peer .pv{min-width:34px;text-align:right}

/* ── console links ──────────────────────────────────────────────────── */
.links{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.links a{display:flex;flex-direction:column;gap:3px;padding:13px 15px;
  border:1px solid var(--rule);background:var(--panel);color:var(--ink);
  text-decoration:none}
.links a:hover{border-color:var(--accent)}
.links a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.links .lt{font:500 12.5px/1.3 var(--sans)}
.links .ld{font:10px/1.4 var(--mono);color:var(--dim);letter-spacing:.06em;
  text-transform:uppercase}

.empty{padding:18px;color:var(--dim);font:11.5px/1 var(--mono);text-align:center;
  border:1px dashed var(--rule)}
.credit{margin-top:auto;padding-top:11px;color:var(--dim);font:9.5px/1.5 var(--mono);
  letter-spacing:.06em}
.credit a{color:var(--dim)}
footer{margin-top:34px;color:var(--dim);font:10px/1.6 var(--mono);
  letter-spacing:.1em;text-transform:uppercase;text-align:center}

@media (max-width:620px){
  .banner{padding:15px}
  .banner .big{font-size:19px}
  .set{margin-left:0;width:100%;gap:18px;padding-top:12px;
    border-top:1px solid var(--rule)}
  .alert .who{min-width:0}
}
@media (prefers-reduced-motion:reduce){
  .tr i{transition:none}
}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <span class="mark">Dashboard</span>
    <span class="pulse" id="pulse"></span>
    <span class="spacer"></span>
    <span class="stamp" id="stamp">loading</span>
    <button id="refresh">Refresh</button>
  </div>
</header>

<main class="wrap" id="main">
  <div class="empty" style="margin-top:22px">Asking the hosts</div>
</main>

<footer>fleet-status agents · read-only vendor APIs · no history kept</footer>
<script>
"use strict";

const POLL_MS = 15000;
/* The accounts half runs on its own, much slower clock: the server caches it
   for hours, so asking every 15s would only mean three vendors hear from every
   tab left open. */
const ACCOUNTS_MS = 300000;
let data = null, accounts = null, busy = false;

/* ── formatting ───────────────────────────────────────────────────────── */

const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

const bytes = n => {
  if (!n && n !== 0) return "—";
  const u = ["B","KB","MB","GB","TB","PB"];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n : n.toFixed(n < 10 ? 1 : 0)) + " " + u[i];
};

/* Cache reads run to the billions; a full-length figure there is a width, not
   a number, and stops being comparable to the one under it. */
const tok = n => {
  if (n == null) return "—";
  if (n < 1000) return String(n);
  const u = ["k","M","B","T"];
  let i = -1;
  while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return n.toFixed(n < 10 ? 1 : 0) + u[i];
};

const num = n => (n ?? 0).toLocaleString();

const dur = s => {
  if (s == null) return "—";
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h " + Math.floor(s % 3600 / 60) + "m";
  return Math.floor(s / 86400) + "d " + Math.floor(s % 86400 / 3600) + "h";
};

const ago = ts => {
  if (!ts) return "—";
  const d = Math.floor(Date.now() / 1000) - ts;
  return d < 0 ? "in " + dur(-d) : dur(d) + " ago";
};

/* Whole days until an ISO timestamp; negative once it has passed. */
const until = iso => {
  if (!iso) return null;
  const t = Date.parse(iso);
  return Number.isNaN(t) ? null : Math.floor((t - Date.now()) / 86400000);
};

/* One place decides what a percentage means, so a disk at 88% is the same
   colour as a memory bar at 88% and neither drifts when one is edited. */
const sev = pct => pct >= 92 ? "bad" : pct >= 85 ? "warn" : "ok";

const st = (kind, word) => `<span class="st ${kind}"><i></i>${esc(word)}</span>`;

const meter = (label, value, pct) => {
  const k = sev(pct);
  return `<div class="m">
    <div class="lab"><span>${esc(label)}</span><b>${esc(value)}</b></div>
    <div class="tr ${k === "ok" ? "" : k}" role="meter"
         aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"
         aria-label="${esc(label)}">
      <i style="width:${Math.max(0, Math.min(100, pct)).toFixed(1)}%"></i></div>
  </div>`;
};

const kv = rows => `<dl class="kv">${rows.filter(Boolean).map(
  ([k, v, cls]) => `<dt>${esc(k)}</dt><dd class="${cls || ""}">${v}</dd>`).join("")}</dl>`;

/* An empty cap means the section heading above already named this panel;
   drawing it twice reads as two things stacked rather than one. */
const panel = (cap, right, body, cls) =>
  `<div class="p ${cls || ""}">${cap || right ? `<div class="cap">
    <span>${esc(cap)}</span>${right || ""}</div>` : ""}${body}</div>`;

const spark = values => {
  const peak = Math.max(1, ...values.map(v => v[1]));
  return `<div class="sp">${values.map(([day, v]) =>
    `<i class="${v ? "" : "none"}" style="height:${Math.max((v / peak) * 100, 3)}%"
        title="${esc(day)}: ${tok(v)} tokens"></i>`).join("")}</div>`;
};

/* ── fleet ────────────────────────────────────────────────────────────── */

function banner(d) {
  const n = d.alerts.length;
  const bad = d.alerts.filter(a => a.level === "bad").length;
  const up = d.hosts.filter(h => h.reachable).length;
  const apps = d.hosts.reduce((s, h) => s + ((h.apps || []).length || 0), 0);
  const jobs = d.hosts.reduce((s, h) => s + ((h.backups || []).length || 0), 0);
  const keys = new Set();
  d.hosts.forEach(h => (h.secrets || []).forEach(s => keys.add(s.name)));

  return `
  <div class="banner ${n ? "" : "clear"}">
    <span class="big">${n === 0 ? "Nothing wrong anywhere"
      : `${bad} broken, ${n - bad} worth a look`}</span>
    <div class="set">
      <div><b>${up}/${d.hosts.length}</b><span>hosts</span></div>
      <div><b>${apps}</b><span>apps</span></div>
      <div><b>${jobs}</b><span>backups</span></div>
      <div><b>${keys.size}</b><span>secrets</span></div>
      <div><b>${n}</b><span>alerts</span></div>
    </div>
  </div>
  ${n ? `<div class="alerts">${d.alerts.map(a => `
    <div class="alert">${st(a.level, a.level === "bad" ? "fail" : "warn")}
      <span class="who">${esc(a.host)}</span>
      <span>${esc(a.what)}</span>
      <span class="detail">${esc(a.detail)}</span></div>`).join("")}</div>` : ""}`;
}

function hostPanel(h) {
  if (!h.reachable) {
    return panel(h.host, st("bad", "unreachable"),
      `<div class="n">—</div><div class="sub">${esc(h.error || "no answer")}</div>`,
      "down");
  }
  const b = h.boot || {}, m = h.memory || {}, g = h.generation || {};
  const memPct = m.total ? 100 * m.used / m.total : 0;
  const load1 = (b.load || [0])[0];
  // Load against core count, not raw: 3.5 is idle on 20 cores and on fire on 2.
  const loadPct = b.cpus ? 100 * load1 / b.cpus : 0;
  const disks = (h.disks || []).filter(d => d && d.total);
  const root = disks.find(d => d.mount === "/") || disks[0];
  const rootPct = root ? 100 * root.used / root.total : 0;
  const failed = (h.health || {}).failed || [];

  return panel(h.host,
    failed.length ? st("bad", `${failed.length} failed`) : st("ok", "healthy"),
    `<div class="n">${Math.round(loadPct)}<small>% load</small></div>
     <div class="tr ${sev(loadPct) === "ok" ? "" : sev(loadPct)}">
       <i style="width:${Math.min(100, loadPct).toFixed(1)}%"></i></div>
     <div class="sub">up ${dur(b.uptime)} · ${esc(b.kernel || "?")} · ${
       load1?.toFixed(2) ?? "—"} of ${b.cpus ?? "?"}</div>
     ${meter("memory", `${bytes(m.used)} / ${bytes(m.total)}`, memPct)}
     ${disks.map(d => meter(d.mount, `${bytes(d.used)} / ${bytes(d.total)}`,
                            100 * d.used / d.total)).join("")}
     ${kv([
       g.number ? ["generation", `${g.number} · ${ago(g.built)}`] : null,
       g.reboot_pending ? ["reboot", "<b>pending</b>", "warn"] : null,
       g.untracked ? ["activation", "test", "warn"] : null,
       ["round trip", (h.rtt_ms ?? "—") + " ms", "dim"],
       failed.length ? ["failed units", failed.map(esc).join("<br>"), "bad"] : null,
     ])}`);
}

function backupPanel(d) {
  const rows = [];
  for (const h of d.hosts) {
    if (!h.reachable) continue;
    const jobs = h.backups || [];
    if (!jobs.length) {
      rows.push(`<tr><td class="d">—</td><td class="d">${esc(h.host)}</td>
        <td>${st("idle", "not configured")}</td>
        <td class="d w" colspan="3">nothing here is backed up</td></tr>`);
      continue;
    }
    for (const b of jobs) {
      const ok = b.result === "success";
      rows.push(`<tr>
        <td>${esc(b.job)}${b.kind === "copy" ? ' <span class="d">copy</span>' : ""}</td>
        <td class="d">${esc(h.host)}</td>
        <td>${b.running ? st("warn", "running") : ok ? st("ok", "success")
                       : st("bad", b.result || "unknown")}</td>
        <td class="d">${esc(ago(b.last))}</td>
        <td class="d r">${esc(dur(b.duration))}</td>
        <td class="d r">${esc(ago(b.next))}</td></tr>`);
    }
  }
  if (!rows.length) return `<div class="empty">no backup jobs reported</div>`;
  return panel("", "", `<div class="scroll"><table>
    <tr><th>job</th><th>host</th><th>last run</th><th>when</th>
      <th class="r">took</th><th class="r">next</th></tr>
    ${rows.join("")}</table></div>`);
}

function servicePanel(d) {
  const rows = [];
  for (const h of d.hosts) {
    if (!h.reachable) continue;
    for (const a of h.apps || []) {
      rows.push(`<tr><td>${esc(a.name)}</td><td class="d">${esc(h.host)}</td>
        <td class="d">app :${a.port}</td>
        <td>${a.up ? st("ok", "http " + a.code) : st("bad", "no answer")}</td>
        <td class="d r">${a.up ? a.ms + " ms" : esc(a.error || "")}</td></tr>`);
    }
    for (const s of h.services || []) {
      const u = s.unit.replace(/\.service$/, "");
      const cf = u.match(/^cloudflared-tunnel-([0-9a-f]{8})/);
      rows.push(`<tr><td title="${esc(s.unit)}">${esc(cf ? "cloudflared " + cf[1] : u)}</td>
        <td class="d">${esc(h.host)}</td><td class="d">unit</td>
        <td>${s.active === "active" ? st("ok", s.sub) : st("bad", s.active)}</td>
        <td class="d r"></td></tr>`);
    }
  }
  if (!rows.length) return `<div class="empty">nothing reported</div>`;
  return panel("", "", `<div class="scroll"><table>
    <tr><th>name</th><th>host</th><th>kind</th><th>state</th><th class="r">rtt</th></tr>
    ${rows.join("")}</table></div>`);
}

function syncPanels(d) {
  const out = [];
  for (const h of d.hosts) {
    const s = h.syncthing;
    if (!s || !s.folders) continue;
    const off = (s.devices || []).filter(dv => !dv.connected).length;
    for (const f of s.folders) {
      out.push(panel(f.label,
        f.need_bytes > 0 ? st("warn", `${f.need_items} behind`) : st("ok", "in sync"),
        `<div class="n">${bytes(f.global_bytes)}</div>
         <div class="sub">${esc(h.host)} · ${(s.devices || []).length} devices${
           off ? ` · ${off} offline` : ""}</div>
         ${f.peers.map(p => `<div class="peer">
           <span class="pn">${esc(p.device)}</span>
           <div class="tr ${p.completion >= 100 ? "" : "warn"}">
             <i style="width:${Math.max(0, Math.min(100, p.completion))}%"></i></div>
           <span class="pv">${p.completion}%</span></div>`).join("")}`));
    }
  }
  return out.join("");
}

/* ── claude ───────────────────────────────────────────────────────────── */

function claudeSection(d) {
  const host = d.hosts.find(h => h.claude && !h.claude.error);
  if (!host) return "";
  const c = host.claude;
  const days = Object.keys(c.days || {}).sort().slice(-30);
  const perDay = days.map(day => [day, Object.values(c.days[day]).reduce(
    (s, m) => s + m.input + m.output + m.cache_read + m.cache_write, 0)]);
  const models = Object.entries(c.models || {}).sort((a, b) => b[1].output - a[1].output);
  const t = models.reduce((s, [, m]) => ({
    output: s.output + m.output, thinking: s.thinking + m.thinking,
    requests: s.requests + m.requests, read: s.read + m.cache_read,
    write: s.write + m.cache_write, search: s.search + m.web_search,
  }), { output: 0, thinking: 0, requests: 0, read: 0, write: 0, search: 0 });

  return `<h2>Claude</h2><div class="g g2">
    ${panel(`${host.host} · 30 days`, "",
      `<div class="n">${tok(t.output)}<small>out</small></div>
       ${spark(perDay)}
       <div class="ends"><span>${esc(days[0] || "")}</span>
         <span>${esc(days[days.length - 1] || "")}</span></div>
       ${kv([
         ["sessions", num(c.sessions)],
         ["prompts", num(c.prompts)],
         ["tool calls", num(c.tools)],
         ["requests", num(t.requests)],
         ["thinking", tok(t.thinking)],
         ["cache read", tok(t.read)],
         ["cache written", tok(t.write)],
         t.search ? ["web searches", num(t.search)] : null,
         ["first seen", esc(c.first || "—"), "dim"],
       ])}`)}
    ${models.map(([name, m]) => panel(name.replace(/^claude-/, ""),
      `<span class="st idle"><i></i>${num(m.requests)} req</span>`,
      `<div class="n">${tok(m.output)}<small>out</small></div>
       ${kv([
         ["thinking", tok(m.thinking)],
         ["cache read", tok(m.cache_read)],
         ["cache written", tok(m.cache_write)],
         ["uncached in", tok(m.input)],
         m.web_search ? ["web searches", num(m.web_search)] : null,
       ])}`)).join("")}
  </div>`;
}

/* ── tailnet ──────────────────────────────────────────────────────────── */

function tailnetSection(d) {
  /* Every host sees the same mesh; the view taken from a reachable one is the
     only view that is not itself a guess. */
  const host = d.hosts.find(h => h.tailnet && h.tailnet.peers && !h.tailnet.error);
  if (!host) return "";
  const t = host.tailnet;
  const rows = [t.node, ...t.peers].filter(Boolean).map(n => {
    const left = until(n.key_expiry);
    /* The node key is the one value here with a deadline. Thirty days is
       enough warning to re-authenticate at leisure; past that it is an outage
       with a date on it. */
    const cls = left == null ? "d" : left < 0 ? "bad" : left < 30 ? "warn" : "d";
    return `<tr><td>${esc(n.name)}${n.self ? ' <span class="d">· this view</span>' : ""}</td>
      <td>${n.online ? st("ok", "online") : st("idle", "offline")}</td>
      <td class="d">${esc(n.os || "—")}</td>
      <td class="d">${esc((n.ips || [])[0] || "—")}</td>
      <td class="r ${cls}">${left == null ? "—" : left < 0 ? "expired" : left + "d"}</td>
      <td class="d r">${bytes(n.rx)} / ${bytes(n.tx)}</td></tr>`;
  }).join("");

  return `<h2>Tailnet</h2>${panel(t.tailnet || "tailnet",
    `<span class="st idle"><i></i>${esc(t.magic_dns || "")} · ${esc(t.version || "")}</span>`,
    `<div class="scroll"><table>
      <tr><th>node</th><th>state</th><th>os</th><th>address</th>
        <th class="r">key expires</th><th class="r">rx / tx</th></tr>
      ${rows}</table></div>`)}`;
}

/* ── accounts ─────────────────────────────────────────────────────────── */

function domainPanel(a) {
  const d = a.domain || {};
  if (d.configured === false)
    return panel("Domain", st("idle", "no credentials"), `<div class="n">—</div>`);
  if (d.error && !d.domain)
    return panel("Domain", st("bad", "unreadable"),
      `<div class="n">—</div><div class="sub">${esc(d.error)}</div>`, "down");

  const left = d.days_left;
  /* A registration is the one dependency with no failover: every hostname,
     every tunnel and the mail hang off it. Sixty days is where renewing stops
     being automatic-if-nothing-breaks and becomes a task. */
  const k = left == null ? "idle" : left < 14 ? "bad" : left < 60 ? "warn" : "ok";
  return panel(d.domain || "domain",
    st(k, left == null ? "unknown" : left + " days"),
    `<div class="n">${left ?? "—"}<small>days left</small></div>
     <div class="tr ${k === "ok" || k === "idle" ? "" : k}">
       <i style="width:${left == null ? 0 : Math.max(0, 100 - (left / 365) * 100).toFixed(1)}%"></i></div>
     <div class="sub">${esc(d.registrar || "")} · ${esc(d.status || "")}</div>
     ${kv([
       ["expires", esc((d.expires || "").slice(0, 10))],
       ["renewal", d.renewal ? "$" + esc(d.renewal) : "—"],
       ["auto-renew", d.auto_renew ? "on" : "<b>off</b>", d.auto_renew ? "" : "bad"],
       ["registrar lock", d.locked ? "on" : "off", d.locked ? "" : "warn"],
       ["whois privacy", d.whois_privacy ? "on" : "off"],
       ["registered", esc((d.registered || "").slice(0, 10)), "dim"],
       ["nameservers", (d.nameservers || []).map(esc).join("<br>") || "—", "dim"],
       d.error ? ["last read", esc(d.error), "warn"] : null,
     ])}
     <p class="credit">registration data via
       <a href="https://porkbun.com" target="_blank" rel="noopener">Porkbun</a></p>`);
}

function mailPanel(a) {
  const cf = a.cloudflare || {};
  if (cf.configured === false)
    return panel("Mail", st("idle", "no token"), `<div class="n">—</div>`);
  const m = cf.email;
  if (!m) return panel("Mail", st("bad", "unreadable"),
    `<div class="n">—</div><div class="sub">${esc(cf.error || "no answer")}</div>`, "down");

  const ok = m.enabled && m.status === "ready";
  const to = (m.catch_all.to || []).join(", ");
  return panel("Mail routing", st(ok ? "ok" : "bad", ok ? "ready" : (m.status || "off")),
    `<div class="n">${(n => `${n}<small>rule${n === 1 ? "" : "s"}</small>`)(
        (m.rules || []).length + (m.catch_all.enabled ? 1 : 0))}</div>
     <div class="sub">${esc((cf.zone || {}).name || "")}</div>
     ${kv([
       ["catch-all", m.catch_all.enabled ? esc(to || "on, no target") : "<b>disabled</b>",
         m.catch_all.enabled ? "" : "bad"],
       ...(m.rules || []).map(r => [r.match.filter(Boolean).join(", ") || r.name,
         esc(r.to.join(", ")), r.enabled ? "" : "bad"]),
     ])}`);
}

function zonePanel(a) {
  const z = (a.cloudflare || {}).zone;
  if (!z) return "";
  return panel("Zone", st(z.status === "active" && !z.paused ? "ok" : "warn",
      z.paused ? "paused" : (z.status || "?")),
    `<div class="n">${z.records}<small>dns records</small></div>
     <div class="sub">cloudflare · ${esc(z.plan || "")}</div>
     ${kv([
       ["active since", esc((z.activated || "").slice(0, 10))],
       ["nameservers", (z.nameservers || []).map(esc).join("<br>") || "—", "dim"],
     ])}`);
}

function storageSection(d, a) {
  const r2 = (a.cloudflare || {}).r2;
  const b2host = d.hosts.find(h => h.b2 && !h.b2.error && h.b2.bucket);
  const b2 = b2host && b2host.b2;
  if (!r2 && !b2) return "";
  const pct = r2 ? (r2.bytes / r2.free_bytes) * 100 : 0;
  const life = b2 && (b2.lifecycle || [])[0];

  return `<h2>Object storage</h2><div class="g g2">
    ${r2 ? panel("R2", st(sev(pct), pct.toFixed(pct < 1 ? 1 : 0) + "% of free tier"),
      `<div class="n">${bytes(r2.bytes)}</div>
       <div class="tr ${sev(pct) === "ok" ? "" : sev(pct)}">
         <i style="width:${Math.min(100, pct).toFixed(1)}%"></i></div>
       <div class="sub">cloudflare · free tier ${bytes(r2.free_bytes)}</div>
       ${kv(r2.buckets.map(b => [b.name, `${bytes(b.bytes)} · ${num(b.objects)} obj`]))}`) : ""}
    ${b2 ? panel("B2", st("ok", "reachable"),
      `<div class="n">${bytes(b2.bytes)}</div>
       <div class="sub">backblaze · ${esc(b2.bucket)}</div>
       ${kv([
         ["objects", num(b2.objects)],
         ["newest upload", b2.newest ? ago(b2.newest) : "—"],
         ["bucket type", esc(b2.type || "—")],
         life ? ["deletes after", life.daysFromHidingToDeleting +
           (life.daysFromHidingToDeleting === 1 ? " day hidden" : " days hidden")] : null,
         ["read by", esc(b2host.host), "dim"],
       ])}`) : ""}
  </div>`;
}

function secretsSection(d) {
  const hosts = d.hosts.filter(h => Array.isArray(h.secrets) && h.secrets.length);
  if (!hosts.length) return "";
  const all = new Set();
  const rows = [];
  for (const h of hosts) {
    for (const s of h.secrets) {
      all.add(s.name);
      rows.push(`<tr><td>${esc(s.name)}</td><td class="d">${esc(h.host)}</td>
        <td class="d r">${esc(s.mode)}</td>
        <td class="d r">${esc(ago(s.modified))}</td></tr>`);
    }
  }
  /* One table rather than a panel per host: the counts are 6, 3 and 19, and
     three panels sized to the tallest leave two thirds of the row empty. */
  return `<h2>Credentials</h2>${panel("",
    `<span class="st idle"><i></i>${all.size} distinct · ${rows.length} deployed</span>`,
    `<div class="scroll"><table>
      <tr><th>name</th><th>host</th><th class="r">mode</th><th class="r">written</th></tr>
      ${rows.join("")}</table></div>`)}`;
}

/* The point of this row: nobody should have to remember which of six vendors
   owns which piece, or keep the links in a bookmarks folder on one laptop. */
const CONSOLES = [
  ["Cloudflare", "https://dash.cloudflare.com", "dns · tunnels · r2 · mail"],
  ["Porkbun", "https://porkbun.com/account/domainsSpeedy", "the registration"],
  ["Backblaze B2", "https://secure.backblaze.com/b2_buckets.htm", "caps and spend"],
  ["Tailscale", "https://login.tailscale.com/admin/machines", "acls · keys · dns"],
  ["Claude", "https://claude.ai/settings/usage", "plan usage and limits"],
  ["GitHub", "https://github.com/neburion?tab=repositories", "app and flake pins"],
];

const consoleSection = () => `<h2>Consoles</h2><div class="links">${
  CONSOLES.map(([n, href, what]) => `<a href="${esc(href)}" target="_blank"
    rel="noopener"><span class="lt">${esc(n)}</span>
    <span class="ld">${esc(what)}</span></a>`).join("")}</div>`;

/* ── render ───────────────────────────────────────────────────────────── */

function render() {
  if (!data) return;
  const sync = syncPanels(data);
  const acc = accounts ? `<h2>Domain and mail</h2><div class="g g3">
      ${domainPanel(accounts)}${mailPanel(accounts)}${zonePanel(accounts)}</div>
    ${storageSection(data, accounts)}` : "";

  document.getElementById("main").innerHTML = `
    ${banner(data)}
    <h2>Hosts</h2><div class="g g3">${data.hosts.map(hostPanel).join("")}</div>
    <h2>Backups</h2>${backupPanel(data)}
    ${sync ? `<h2>Sync</h2><div class="g g3">${sync}</div>` : ""}
    <h2>Services</h2>${servicePanel(data)}
    ${claudeSection(data)}
    ${tailnetSection(data)}
    ${acc}
    ${secretsSection(data)}
    ${consoleSection()}`;
  tick();
}

function tick() {
  const el = document.getElementById("stamp");
  if (el) el.textContent = data ? "updated " + ago(data.at) : "—";
}

async function load(force) {
  if (busy) return;
  busy = true;
  const btn = document.getElementById("refresh");
  btn.disabled = true;
  document.getElementById("pulse").classList.remove("off");
  try {
    const r = await fetch("/api/status" + (force ? "?force=1" : ""),
                          { headers: { "Accept": "application/json" } });
    // A session can expire while a tab is left open overnight; the API says
    // 401 and the page would otherwise sit there showing yesterday.
    if (r.status === 401) { location.href = "/login"; return; }
    if (!r.ok) throw new Error("HTTP " + r.status);
    data = await r.json();
    render();
  } catch (e) {
    document.getElementById("pulse").classList.add("off");
    const el = document.getElementById("stamp");
    if (el) el.textContent = "dashboard unreachable";
  } finally {
    busy = false;
    btn.disabled = false;
  }
}

async function loadAccounts(force) {
  try {
    const r = await fetch("/api/accounts" + (force ? "?force=1" : ""),
                          { headers: { "Accept": "application/json" } });
    if (r.status === 401) { location.href = "/login"; return; }
    if (!r.ok) throw new Error("HTTP " + r.status);
    accounts = await r.json();
    render();
  } catch (e) {
    // A vendor being unreachable is not a reason to stop drawing the fleet.
  }
}

document.getElementById("refresh").addEventListener("click", () => {
  load(true);
  loadAccounts(true);
});
// Coming back to a backgrounded tab should not show a stale page for 15s.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") load(false);
});
setInterval(() => load(false), POLL_MS);
setInterval(() => loadAccounts(false), ACCOUNTS_MS);
setInterval(tick, 1000);
load(false);
loadAccounts(false);
</script>
</body>
</html>
